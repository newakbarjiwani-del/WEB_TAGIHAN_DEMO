<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Offline</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700,800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: -0.011em;
      background: #101814;
      color: #e8f0eb;
      padding: 1.25rem;
    }
    .card {
      width: min(420px, 100%);
      background: #18241e;
      border: 1px solid #2c3d34;
      border-radius: 4px;
      padding: 1.25rem 1.1rem;
      text-align: center;
    }
    img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; margin-bottom: .75rem; border: 1px solid #2c3d34; }
    h1 { margin: 0 0 .45rem; font-size: 1.1rem; }
    p { margin: 0 0 1rem; color: #a8b8ae; font-size: .92rem; line-height: 1.5; }
    button {
      min-height: 42px;
      width: 100%;
      border: none;
      border-radius: 4px;
      background: #5ecf84;
      color: #0a1a10;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet terputus. Periksa jaringan Anda, lalu coba lagi untuk cek atau bayar tagihan.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
